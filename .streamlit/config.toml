# Espelha app/theme.py, que continua sendo a fonte de verdade das cores. TOML nao
# le Python, entao a duplicacao e inevitavel - quem guarda a sincronia e
# tests/test_tema.py.
#
# [theme] e o modo claro e o default: sem parametro na URL, e este que vale, e por
# isso o dashboard nunca abre seguindo o tema do sistema operacional. De proposito
# nao existe um [theme.light]: declarar os dois lados faria o Streamlit montar um
# "Custom Theme Auto", que e justamente o que segue o sistema.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f9f9f7"
textColor = "#0b0b0b"
font = "sans serif"

# Alcancado so por ?embed_options=dark_theme, que o toggle da sidebar monta.
[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#0d0d0d"
textColor = "#ffffff"

[browser]
gatherUsageStats = false

# Sem o menu de desenvolvedor: os itens dele sao fixos em ingles no bundle do
# Streamlit e nao servem para quem so vai ler o dashboard.
[client]
toolbarMode = "minimal"
